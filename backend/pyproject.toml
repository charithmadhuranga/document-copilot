[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "supabase>=2.0.0",
    "openai>=1.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "html2text==2025.4.15",
    "tiktoken==0.13.0",
    "pydantic-ai==1.106.0",
    "google-genai>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.optional-dependencies]
cohere = ["cohere>=5.0.0"]
voyageai = ["voyageai>=0.1.0"]
sentence-transformers = ["sentence-transformers>=3.0.0"]
bedrock = ["boto3>=1.35.0"]
all = ["document-copilot-backend[cohere,voyageai,sentence-transformers,bedrock]"]

[tool.uv]
add-bounds = "exact"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that hit external services",
]
